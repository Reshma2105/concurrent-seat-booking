# Tests use an in-memory database so they run anywhere without MySQL.
# LOCK_TIMEOUT lets pessimistic-lock waiters queue up instead of failing after 1 second.
spring.datasource.url=jdbc:h2:mem:seatbooking;MODE=MySQL;LOCK_TIMEOUT=20000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

booking.hold-minutes=5
# effectively turn the background job off; tests call it directly
booking.hold-release-interval-ms=3600000
