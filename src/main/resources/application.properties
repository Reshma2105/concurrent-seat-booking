spring.application.name=concurrent-seat-booking
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/seat_booking?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# How long a seat stays reserved while the user is at checkout
booking.hold-minutes=5
# How often expired holds are released
booking.hold-release-interval-ms=30000
